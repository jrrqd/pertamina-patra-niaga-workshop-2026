# Patra Niaga command center — https://radr.nxtdev.xyz/patra/
# Separate from /ops/ family dashboard. Do not edit ops-dashboard.conf for this.
# Include from the osnai site config after review. Reload nginx (never restart).

location = /patra {
    return 301 /patra/;
}

location ^~ /patra/api/ {
    auth_basic "Patra Workshop";
    auth_basic_user_file /etc/nginx/patra-cc.htpasswd;
    client_max_body_size 32k;

    proxy_pass http://127.0.0.1:3072;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_buffering off;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /patra/ {
    alias /var/www/patra-cc/;
    index index.html;
    autoindex off;

    auth_basic "Patra Workshop";
    auth_basic_user_file /etc/nginx/patra-cc.htpasswd;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
